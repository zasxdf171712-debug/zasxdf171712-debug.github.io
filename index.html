<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ha Jun PORTFOLIO</title>
  <!-- Google Fonts 적용 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* 1. 기본 스타일 초기화 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* 2. 상단 네비게이션 헤더 (GNB) */
    header {
      width: 100%;
      padding: 28px 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
    }

    .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -0.5px;
      color: #0f172a;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
    }

    .nav-links a {
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #0f172a;
    }

    .contact-btn {
      background-color: #0f172a;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .contact-btn:hover {
      background-color: #1e293b;
      transform: translateY(-1px);
    }

    /* 3. 메인 콘텐츠 (좌/우 2열 히어로 레이아웃) */
    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 140px 64px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
    }

    /* 좌측 영역: 헤드라인, 체크리스트, 버튼, 태그 */
    .hero-left {
      flex: 1;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero-title {
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #0f172a;
      margin-bottom: 24px;
    }

    .hero-title .highlight {
      color: #ff3366; /* 이미지와 동일한 핑크 포인트 컬러 */
    }

    /* 체크리스트 스타일 */
    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: #475569;
      font-weight: 500;
    }

    .check-icon {
      width: 18px;
      height: 18px;
      background-color: #ffe6eb;
      color: #ff3366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* 액션 버튼 */
    .cta-button {
      background-color: #0d1322;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 28px;
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 48px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(13, 19, 34, 0.15);
    }

    .cta-button:hover {
      background-color: #1e293b;
      transform: translateY(-2px);
    }

    /* 하단 스택 태그 */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      background-color: #f1f5f9;
      color: #475569;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 12px;
    }

    /* 우측 영역: 영상 자동재생 카드 */
    .hero-right {
      flex: 1;
      max-width: 580px;
      width: 100%;
    }

    .video-card {
      width: 100%;
      aspect-ratio: 1.25 / 1;
      background-color: #e2e8f0;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 영상 대체용 플레이스홀더 (동영상이 없을 경우 표시) */
    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      color: #475569;
    }

    .play-button-icon {
      width: 64px;
      height: 64px;
      background-color: #ff0000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 1.5rem;
      padding-left: 4px;
      box-shadow: 0 8px 20px rgba(255, 0, 0, 0.3);
    }

    .video-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
    }

    /* 4. 모바일 반응형 (화면이 좁아질 때 세로 배치) */
    @media (max-width: 1024px) {
      header {
        padding: 20px 32px;
      }
      main {
        flex-direction: column;
        padding: 120px 32px 60px;
        gap: 40px;
      }
      .hero-left, .hero-right {
        max-width: 100%;
      }
      .hero-title {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 640px) {
      .nav-links {
        display: none; /* 모바일 메뉴 숨김 */
      }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 (GNB) -->
  <header>
    <a href="#" class="logo">Ha Jun</a>
    
    <nav>
      <ul class="nav-links">
        <li><a href="#" class="active">About</a></li>
        <li><a href="#">Resume</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Play&Analysis</a></li>
      </ul>
      <a href="mailto:nsminzzang@naver.com" class="contact-btn">Contact</a>
    </nav>
  </header>

  <!-- 메인 히어로 세션 -->
  <main>
    <!-- 좌측: 소개 텍스트 및 상세 요소 -->
    <div class="hero-left">
      <h1 class="hero-title">
        Work with the world’s<br>
        best in <span class="highlight">game design</span>
      </h1>

      <ul class="feature-list">
        <li class="feature-item">
          <span class="check-icon">✓</span>
          <span>시스템 명세서 및 와이어프레임 설계 경험 보유</span>
        </li>
        <li class="feature-item">
          <span class="check-icon">✓</span>
          <span>Unity 엔진 기반의 프로토타이핑 및 프로젝트 수행</span>
        </li>
        <li class="feature-item">
          <span class="check-icon">✓</span>
          <span>데이터 구조화 및 유저 중심의 UI/UX 설계</span>
        </li>
      </ul>

      <a href="https://app.notion.com/p/3457f46f981280c5b005c17643011797" target="_blank" class="cta-button">
        ✦ 다양한 포트폴리오 구경하기
      </a>

      <div class="tags-container">
        <span class="tag">System Design</span>
        <span class="tag">UI/UX</span>
        <span class="tag">Figma</span>
        <span class="tag">Unity</span>
        <span class="tag">Excel</span>
      </div>
    </div>

    <!-- 우측: 게임 플레이 및 연출 영상 영역 -->
    <div class="hero-right">
      <div class="video-card">
        <!-- 실제 비디오 파일 연결 시 아래 <video> 태그의 주석을 해제하고 src에 파일 경로/링크를 넣으세요 -->
  
        <video autoplay loop muted playsinline>
          <source src="https://www.youtube.com/watch?v=WZrpm69TjHg" type="video/mp4">
        </video>
        -->

        <!-- 영상 파일이 없을 경우 보이는 기본 예시 플레이스홀더 -->
        <div class="video-placeholder">
          <div class="play-button-icon">▶</div>
          <div class="video-text">영상 자동재생</div>
        </div>
      </div>
    </div>
  </main>

  <!-- 자바스크립트 (필요 시 동작 추가) -->
  <script>
    // 이메일 클릭 또는 기본 동작 핸들러
  </script>
</body>
</html>
