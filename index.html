<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ha Jun PORTFOLIO</title>
  <!-- Google Fonts 적용 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* 1. 기본 스타일 초기화 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #f8f9fa;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* 2. 상단 네비게이션 헤더 (GNB) */
    header {
      width: 100%;
      padding: 20px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      background-color: rgba(248, 249, 250, 0.85);
      backdrop-filter: blur(8px);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0f172a;
    }

    .logo span {
      color: #10b981;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
      font-size: 0.95rem;
      font-weight: 500;
      color: #64748b;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #10b981;
    }

    .contact-btn {
      background-color: #0f172a;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .contact-btn:hover {
      background-color: #1e293b;
      transform: translateY(-1px);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      background-color: #ffffff;
      font-size: 0.8rem;
      color: #475569;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    /* 3. 메인 콘텐츠 (카드 레이아웃) */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 120px 20px 60px;
    }

    .card-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 520px;
      padding: 48px 36px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .icon-box {
      width: 64px;
      height: 64px;
      background-color: #ecfdf5;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
    }

    .card-subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      color: #10b981;
      margin-top: -12px;
    }

    .card-description {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.6;
      word-break: keep-all;
    }

    /* 핵심 역량 태그 */
    .skills-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 8px 0;
    }

    .skill-tag {
      background-color: #f1f5f9;
      color: #334155;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 12px;
    }

    .action-button {
      width: 100%;
      max-width: 320px;
      background-color: #0f172a;
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 500;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      transition: all 0.2s ease;
    }

    .action-button:hover {
      background-color: #1e293b;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      transform: translateY(-2px);
    }

    .copy-info {
      font-size: 0.8rem;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .copy-info:hover {
      color: #64748b;
    }

    /* 4. 우측 스크롤 인디케이터 (Dot Navigation) */
    .right-indicator {
      position: fixed;
      right: 32px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }

    .indicator-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .indicator-label {
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .indicator-dot {
      width: 8px;
      height: 8px;
      background-color: #cbd5e1;
      border-radius: 50%;
    }

    .indicator-dot.active {
      height: 24px;
      border-radius: 12px;
      background-color: #10b981;
    }

    /* 5. 모바일 반응형 */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }
      .nav-links {
        display: none;
      }
      .right-indicator {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header>
    <div class="logo">Ha Jun<span>.</span></div>
    
    <nav>
      <ul class="nav-links">
        <li><a href="#" class="active">About</a></li>
        <li><a href="#">Resume</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Play & Analysis</a></li>
      </ul>
      <a href="mailto:nsminzzang@naver.com" class="contact-btn">Contact</a>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>OPEN FOR WORK</span>
      </div>
    </nav>
  </header>

  <!-- 메인 메세지 카드 영역 (INTRO) -->
  <main>
    <div class="card-container">
      <div class="icon-box">🎮</div>
      
      <h1 class="card-title">게임 기획자 포트폴리오</h1>
      <p class="card-subtitle">System & UI/UX Design</p>
      
      <p class="card-description">
        시스템 설계부터 와이어프레임 작성, 데이터 밸런싱까지<br>
        유저 중심의 재미를 문서로 구체화하는 기획자입니다.
      </p>

      <!-- 핵심 태그 -->
      <div class="skills-container">
        <span class="skill-tag">System Design</span>
        <span class="skill-tag">UI/UX</span>
        <span class="skill-tag">Figma</span>
        <span class="skill-tag">Unity</span>
        <span class="skill-tag">Excel</span>
      </div>

      <!-- 포트폴리오 상세 링크 (노션/구글 드라이브 등) -->
      <a href="https://app.notion.com/p/3457f46f981280c5b005c17643011797" target="_blank" class="action-button">
        📂 대표 기획서 열람하기
      </a>

      <!-- 이메일 복사 안내 -->
      <div class="copy-info" onclick="copyEmail('nsminzzang@naver.com')">
        📋 이메일 복사 (nsminzzang@naver.com)
      </div>
    </div>
  </main>

  <!-- 우측 세션 위치 인디케이터 -->
  <div class="right-indicator">
    <div class="indicator-item">
      <span class="indicator-label">INTRO</span>
      <div class="indicator-dot active"></div>
    </div>
    <div class="indicator-item">
      <div class="indicator-dot"></div>
    </div>
    <div class="indicator-item">
      <div class="indicator-dot"></div>
    </div>
    <div class="indicator-item">
      <div class="indicator-dot"></div>
    </div>
  </div>

  <!-- 간단한 자바스크립트 (이메일 복사) -->
  <script>
    function copyEmail(email) {
      navigator.clipboard.writeText(email).then(() => {
        alert('이메일 주소가 클립보드에 복사되었습니다: ' + email);
      });
    }
  </script>
</body>
</html>
